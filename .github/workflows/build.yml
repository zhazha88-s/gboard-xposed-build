name: Build Gboard Xposed diagnostic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source archive
        run: |
          test -f GboardPatches-Xposed-phone-build.zip
          unzip -q -o GboardPatches-Xposed-phone-build.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon -p GboardPatches-Xposed :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardPatches-diagnostic-APK
          path: GboardPatches-Xposed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
